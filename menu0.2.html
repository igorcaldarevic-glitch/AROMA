<!DOCTYPE html>
<html lang="hr" class="scroll-smooth overflow-x-hidden">

<head>
    <script>
        (function () {
            const theme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (theme === 'dark' || (!theme && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroma Slastičarna - Jelovnik | Menu</title>
    <meta name="description" content="Potpuni jelovnik Aroma Slastičarne - tradicija od 1923.">

    <link rel="icon" type="image/png" href="images/webp/amblem.webp">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <style>
        @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/playfair-display-v40-latin-regular.woff2') format('woff2'); }
        @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/montserrat-v31-latin-400.woff2') format('woff2'); }
        @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/montserrat-v31-latin-700.woff2') format('woff2'); }

        body { font-family: 'Montserrat', sans-serif; transition: background-color 0.3s ease; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Modern Card Styling */
        .menu-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(197, 160, 89, 0.15);
            border-radius: 24px;
            padding: 12px;
            display: flex;
            flex-direction: row;
            gap: 16px;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            height: 100%;
            cursor: pointer;
        }

        .dark .menu-card {
            background: rgba(30, 30, 30, 0.9);
            border-color: rgba(197, 160, 89, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .menu-card:hover {
            border-color: #c5a059;
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(197, 160, 89, 0.15);
        }

        .card-img-wrapper {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(197, 160, 89, 0.1);
        }

        @media (max-width: 640px) {
            .card-img-wrapper { width: 85px; height: 85px; }
        }

        /* Category Active State */
        .category-btn.active {
            background: #c5a059;
            color: white;
            box-shadow: 0 8px 20px rgba(197, 160, 89, 0.3);
            transform: scale(1.05);
        }

        /* Dubai/Special Highlight */
        .special-highlight {
            border: 2px solid #c5a059 !important;
            background: linear-gradient(135deg, rgba(255, 255, 255, 1) 0%, rgba(197, 160, 89, 0.05) 100%);
        }
        .dark .special-highlight {
            background: linear-gradient(135deg, rgba(30, 30, 30, 1) 0%, rgba(197, 160, 89, 0.1) 100%);
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(197, 160, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0); }
        }
        .pulse-premium { animation: pulse-gold 2s infinite; }
    </style>
</head>

<body class="antialiased bg-[#fdfdfb] dark:bg-[#0d0d0d] text-gray-900 dark:text-gray-100">

    <!-- Background Decoration -->
    <div class="fixed inset-0 pointer-events-none opacity-40 dark:opacity-20 z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-[#c5a059]/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-[#a0c878]/10 rounded-full blur-[120px]"></div>
    </div>

    <!-- Navigation -->
    <nav class="fixed top-0 z-50 w-full transition-all duration-500 py-6" id="navbar">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="w-28 md:w-36 transition-all duration-300" id="nav-logo">
                <img src="images/webp/AROMA.webp" alt="AROMA Logo" class="dark:filter dark:invert">
            </a>

            <div class="flex items-center gap-4">
                <!-- Language -->
                <div class="hidden md:flex bg-white/50 dark:bg-black/50 backdrop-blur-md rounded-full border border-black/5 dark:border-white/10 p-1">
                    <button onclick="changeLanguage('hr')" class="px-3 py-1 text-xs font-bold rounded-full transition-all lang-btn active" id="lang-hr">HR</button>
                    <button onclick="changeLanguage('en')" class="px-3 py-1 text-xs font-bold rounded-full transition-all lang-btn" id="lang-en">EN</button>
                    <button onclick="changeLanguage('de')" class="px-3 py-1 text-xs font-bold rounded-full transition-all lang-btn" id="lang-de">DE</button>
                </div>

                <button id="theme-toggle" class="p-3 rounded-full bg-white dark:bg-gray-800 shadow-lg hover:scale-110 transition-transform">
                    <svg id="sun-icon" class="hidden dark:block w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
                    <svg id="moon-icon" class="dark:hidden w-5 h-5 text-gray-700" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative z-10 pt-32 pb-20 px-6 max-w-7xl mx-auto">
        
        <!-- Hero Section -->
        <header class="text-center mb-12">
            <h1 class="font-serif text-5xl md:text-7xl font-bold mb-4 tracking-tight" id="hero-title">Jelovnik</h1>
            <p class="text-gray-500 dark:text-gray-400 max-w-xl mx-auto" id="hero-subtitle">Okusi tradicije u svakom zalogaju, pripremljeni s ljubavlju od 1923.</p>
        </header>

        <!-- Dynamic Category Bar -->
        <div class="flex items-center gap-3 overflow-x-auto no-scrollbar py-6 mb-8 sticky top-[75px] z-40 bg-[#fdfdfb]/80 dark:bg-[#0d0d0d]/80 backdrop-blur-md -mx-6 px-6 border-b border-black/5">
            <button onclick="setCategory('topli-napici')" class="category-btn active whitespace-nowrap px-6 py-2.5 rounded-full bg-white dark:bg-gray-800 shadow-sm border border-black/5 dark:border-white/5 text-sm font-bold transition-all" data-cat="topli-napici" id="cat-btn-hot">Topli Napici</button>
            <button onclick="setCategory('bezalkoholna-pica')" class="category-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-white dark:bg-gray-800 shadow-sm border border-black/5 dark:border-white/5 text-sm font-bold transition-all" data-cat="bezalkoholna-pica" id="cat-btn-soft">Pića</button>
            <button onclick="setCategory('smoothie')" class="category-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-white dark:bg-gray-800 shadow-sm border border-black/5 dark:border-white/5 text-sm font-bold transition-all" data-cat="smoothie" id="cat-btn-smoothie">Smoothie</button>
            <button onclick="setCategory('kolaci')" class="category-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-white dark:bg-gray-800 shadow-sm border border-black/5 dark:border-white/5 text-sm font-bold transition-all" data-cat="kolaci" id="cat-btn-pastry">Kolači</button>
            <button onclick="setCategory('palacinke')" class="category-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-white dark:bg-gray-800 shadow-sm border border-black/5 dark:border-white/5 text-sm font-bold transition-all" data-cat="palacinke" id="cat-btn-pancakes">Palačinke</button>
            <button onclick="setCategory('sladoled')" class="category-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-white dark:bg-gray-800 shadow-sm border border-black/5 dark:border-white/5 text-sm font-bold transition-all" data-cat="sladoled" id="cat-btn-ice">Sladoled</button>
        </div>

        <!-- Menu Items Grid -->
        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Items injected by JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-black/5 dark:border-white/10 py-12 px-6 bg-white dark:bg-black/20">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-center md:text-left">
                <img src="images/webp/amblem.webp" alt="Amblem" class="w-16 h-16 mx-auto md:mx-0 mb-4 opacity-80">
                <p class="text-sm text-gray-500">&copy; 2025 Slastičarna Aroma. Tradicija od 1923.</p>
                <p class="text-[10px] text-gray-400 mt-1">Digitalni cjenik: <a href="https://icstudio.neocities.org" class="hover:text-aroma-gold">ICStudio</a></p>
            </div>
            
            <div class="flex gap-4">
                <div class="p-4 border border-[#c5a059]/30 rounded-2xl bg-white dark:bg-gray-800 max-w-xs">
                    <h5 class="text-xs font-bold uppercase tracking-widest text-[#c5a059] mb-2">Normativ</h5>
                    <p class="text-[10px] text-gray-500 leading-tight">Kava: 8g + 4g šećer. Kolač: 1 kom. Sladoled: 1 kuglica. PDV uračunat.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Image Modal -->
    <div id="img-modal" class="fixed inset-0 z-[100] hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-6 cursor-pointer" onclick="closeModal()">
        <div class="max-w-4xl w-full" onclick="event.stopPropagation()">
            <img id="modal-img" src="" alt="Prikaz" class="w-full h-auto max-h-[80vh] object-contain rounded-2xl shadow-2xl">
            <h3 id="modal-caption" class="text-center text-white font-serif text-2xl mt-4"></h3>
        </div>
    </div>

    <!-- Svi podaci artikala -->
    <script>
        const menuData = {
            hr: {
                titles: { hero: "Jelovnik", sub: "Okusi tradicije u svakom zalogaju, pripremljeni s ljubavlju od 1923." },
                categories: { hot: "Topli Napici", soft: "Pića", smoothie: "Smoothie", pastry: "Kolači", pancakes: "Palačinke", ice: "Sladoled" },
                "topli-napici": [
                    { name: "Kava", desc: "Classic espresso", price: "1,90 €", img: "images/menu-webp/topli-napici/kava.webp" },
                    { name: "Kava s mlijekom", desc: "Coffee with milk", price: "2,00 €", img: "images/menu-webp/topli-napici/Kava-s-mlijekom.webp" },
                    { name: "Kava sa šlagom", desc: "Coffee with cream", price: "2,00 €", img: "images/menu-webp/topli-napici/Kava-sa-šlagom.webp" },
                    { name: "Kava bez kofeina", desc: "Decaf coffee", price: "2,50 €", img: "images/menu-webp/topli-napici/Decaf-Coffee.webp" },
                    { name: "Cappuccino", desc: "Talijanski klasik", price: "2,50 €", img: "images/menu-webp/topli-napici/Cappuccino.webp" },
                    { name: "Bijela kava", desc: "White coffee", price: "2,50 €", img: "images/menu-webp/topli-napici/Bijela-kava.webp" },
                    { name: "Vruća čokolada", desc: "Gusta i kremasta", price: "3,50 €", img: "images/menu-webp/topli-napici/vruca-cokolada.webp" },
                    { name: "Čaj s limunom i medom", desc: "Selekcija čajeva", price: "2,00 €", img: "images/menu-webp/topli-napici/caj2.webp" },
                    { name: "Nescafe", desc: "Razni okusi", price: "2,50 €", img: "images/menu-webp/topli-napici/Nescaffe.webp" }
                ],
                "bezalkoholna-pica": [
                    { name: "Coca-Cola", desc: "0,25 l", price: "3,20 €", img: "images/menu-webp/Bezalkoholna-pica/Coca-cola.webp" },
                    { name: "Fanta / Sprite", desc: "0,25 l", price: "3,20 €", img: "images/menu-webp/Bezalkoholna-pica/Fanta.webp" },
                    { name: "Schweppes", desc: "Tangerine / Bitter Lemon", price: "3,20 €", img: "images/menu-webp/Bezalkoholna-pica/Schweppes1.webp" },
                    { name: "Cedevita", desc: "Naranča / Limun", price: "2,80 €", img: "images/menu-webp/Bezalkoholna-pica/Cedevita.webp" },
                    { name: "Prirodni sokovi", desc: "0,20 l", price: "3,40 €", img: "images/menu-webp/Bezalkoholna-pica/Prirodni-sok.webp" },
                    { name: "Limunada", desc: "0,30 l", price: "3,00 €", img: "images/menu-webp/Bezalkoholna-pica/Limunada3.webp" }
                ],
                "smoothie": [
                    { name: "Ljetni smoothie", desc: "Osvježavajuća bomba", price: "3,90 €", img: "images/menu-webp/Smoothie/Ljetni.webp" },
                    { name: "Antistres", desc: "Mix za opuštanje", price: "3,70 €", img: "images/menu-webp/Smoothie/Antistres.webp" },
                    { name: "Zdrava navika", desc: "Zeleni mix", price: "3,70 €", img: "images/menu-webp/Smoothie/Zdrava-navika.webp" }
                ],
                "kolaci": [
                    { name: "Dubai torta", desc: "Pistacija, kadaif i vrhunska čokolada", price: "4,90 €", img: "images/menu-webp/Kolači/dubai.webp", special: true },
                    { name: "Ferrero torta", desc: "Lješnjak i čokolada", price: "3,50 €", img: "images/menu-webp/Kolači/ferrero2.webp" },
                    { name: "Pistachio cheesecake", desc: "Kremasti sir i pistacija", price: "4,90 €", img: "images/menu-webp/Kolači/pistacio-cheesecake.webp" },
                    { name: "Maxi King", desc: "Karamela i lješnjak", price: "4,90 €", img: "images/menu-webp/Kolači/maxi-king.webp" },
                    { name: "Krempita", desc: "Domaća krema", price: "3,00 €", img: "images/menu-webp/Kolači/krempita.webp" },
                    { name: "Jaffa torta", desc: "Naranča i čokolada", price: "3,50 €", img: "images/menu-webp/Kolači/jaffa2.webp" },
                    { name: "Tiramisu", desc: "Talijanski klasik", price: "3,50 €", img: "images/menu-webp/Kolači/tiramisu.webp" }
                ],
                "palacinke": [
                    { name: "Dubai", desc: "Krema od pistacije i kadaif", price: "9,00 €", img: "images/menu-webp/palacinke/dubai.webp", special: true },
                    { name: "Nutella", desc: "Originalni namaz", price: "4,50 €", img: "images/menu-webp/palacinke/nutella.webp" },
                    { name: "Kinder Bueno", desc: "Bueno krema", price: "6,50 €", img: "images/menu-webp/palacinke/bueno.webp" },
                    { name: "Linolada", desc: "Mliječni namaz", price: "4,50 €", img: "images/menu-webp/palacinke/linolada.webp" }
                ],
                "sladoled": [
                    { name: "Svi okusi", desc: "Kuglica sladoleda", price: "2,00 €", img: "images/menu-webp/Sladoled/svi.webp" },
                    { name: "Dubai Čokolada", desc: "Pistacija i čokolada", price: "2,00 €", img: "images/menu-webp/Sladoled/dubai.webp" },
                    { name: "Kinder Bueno", desc: "Kremasti užitak", price: "2,00 €", img: "images/menu-webp/Sladoled/bueno.webp" },
                    { name: "Nutella", desc: "Omiljeni namaz", price: "2,00 €", img: "images/menu-webp/Sladoled/nutella.webp" },
                    { name: "Vanilija / Čokolada", desc: "Tradicionalno od 1923.", price: "2,00 €", img: "images/menu-webp/Sladoled/vanilija.webp" },
                    { name: "Mini posuda", desc: "4 kuglice", price: "8,00 €", img: "images/menu-webp/Sladoled/mini.webp" },
                    { name: "Mala posuda", desc: "5+1 gratis", price: "10,00 €", img: "images/menu-webp/Sladoled/mala.webp" }
                ]
            },
            en: {
                titles: { hero: "Menu", sub: "Tastes of tradition in every bite, prepared with love since 1923." },
                "topli-napici": [{ name: "Coffee", desc: "Classic espresso", price: "1.90 €", img: "images/menu-webp/topli-napici/kava.webp" }]
                // ... populate same way for EN/DE
            }
        };

        let currentLang = 'hr';
        let currentCat = 'topli-napici';

        function renderGrid() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            
            const items = menuData[currentLang][currentCat] || [];
            
            items.forEach((item, index) => {
                const specialClass = item.special ? 'special-highlight pulse-premium' : '';
                const card = `
                    <div class="menu-item-anim opacity-0 translate-y-6">
                        <div class="menu-card ${specialClass}" onclick="openModal('${item.img}', '${item.name}')">
                            <div class="card-img-wrapper">
                                <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover transition-transform duration-700 hover:scale-110">
                            </div>
                            <div class="card-info">
                                <h4 class="font-bold text-lg leading-tight dark:text-white">${item.name}</h4>
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 line-clamp-2">${item.desc}</p>
                                <div class="flex items-center justify-between mt-2">
                                    <span class="text-[#c5a059] font-bold text-lg font-serif">${item.price}</span>
                                    <div class="w-6 h-6 rounded-full bg-[#c5a059]/10 flex items-center justify-center">
                                        <svg class="w-3 h-3 text-[#c5a059]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });

            // GSAP Intro
            gsap.to(".menu-item-anim", {
                opacity: 1,
                y: 0,
                stagger: 0.08,
                duration: 0.5,
                ease: "power2.out",
                overwrite: true
            });
            
            ScrollTrigger.refresh();
        }

        function setCategory(cat) {
            currentCat = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('data-cat') === cat) btn.classList.add('active');
            });
            renderGrid();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`lang-${lang}`).classList.add('active');
            
            // Update static texts
            const t = menuData[lang].titles;
            if(t) {
                document.getElementById('hero-title').textContent = t.hero;
                document.getElementById('hero-subtitle').textContent = t.sub;
            }
            renderGrid();
        }

        // Modal
        function openModal(src, title) {
            const modal = document.getElementById('img-modal');
            document.getElementById('modal-img').src = src;
            document.getElementById('modal-caption').textContent = title;
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('img-modal').style.display = 'none';
        }

        // Theme
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Init
        window.addEventListener('load', () => {
            renderGrid();
            
            window.addEventListener('scroll', () => {
                const nav = document.getElementById('navbar');
                if(window.scrollY > 50) {
                    nav.classList.add('bg-white/90', 'dark:bg-black/90', 'backdrop-blur-xl', 'py-3', 'shadow-md');
                    nav.classList.remove('py-6');
                } else {
                    nav.classList.remove('bg-white/90', 'dark:bg-black/90', 'backdrop-blur-xl', 'py-3', 'shadow-md');
                    nav.classList.add('py-6');
                }
            });
        });
    </script>
</body>
</html>
